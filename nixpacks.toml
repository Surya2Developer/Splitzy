[phases.setup]
nixPkgs = ["python312Full"]

[phases.install]
cmds = []  # Leave empty. Nixpacks auto-installs dependencies from requirements.txt

[phases.build]
cmds = [
    "cp -r backend/* ."
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHONPATH = "/app"
PYTHONUNBUFFERED = "1"

[nixpacks]
